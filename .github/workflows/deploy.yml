name: Deploy to GitHub Pages

# Publishes the site to GitHub Pages on every push to main.
# The published artifact contains ONLY public files — build tooling,
# page sources, partials and brand sheets are left out.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regenerate the root HTML from _pages/ + _partials/ so the deployed
      # output can never drift from the committed sources.
      - name: Build pages from sources
        run: node build.js

      - name: Assemble publish directory
        run: |
          set -euo pipefail
          mkdir -p dist

          # Root-level files: index.html and 404.html
          cp ./*.html dist/

          # Page folders — each holds an index.html so URLs stay extensionless.
          # Disable globbing fallback so an empty match doesn't iterate.
          shopt -s nullglob
          for d in */; do
            name="${d%/}"
            case "$name" in
              _*|assets|docs|node_modules) continue ;;
            esac
            cp -r "$d" dist/
          done
          shopt -u nullglob

          # Static assets
          cp -r assets dist/

          # SEO / PWA files — each optional, so guard with `if` rather than
          # `[ -f x ] && cp`, which returns a non-zero status when the file is
          # absent and would abort the step under `set -e`.
          for f in sitemap.xml robots.txt site.webmanifest; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done

          # Custom domain. Optional: while DNS is not yet live the file is
          # intentionally absent so the site stays reachable on github.io.
          if [ -f CNAME ]; then
            cp CNAME dist/
            echo "Custom domain: $(cat CNAME)"
          else
            echo "Custom domain: none (CNAME absent - serving on github.io)"
          fi

          # Stop GitHub Pages from running Jekyll over the output
          touch dist/.nojekyll

          echo "Published files:"
          find dist -type f | sort | sed 's/^/  /'

          echo "Published files:"
          find dist -type f | sort | sed 's/^/  /'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
