<section class="auth">
  <div class="auth__card" data-reveal data-reveal-y="30">
    <a class="auth__brand" href="index.html">
      <img src="assets/img/logo-mark.svg" alt="" width="34" height="34">
      <span class="brand__name">Veri<em>Trace</em> AI</span>
    </a>

    <h1 class="h3">Welcome back</h1>
    <p class="muted small mt-3">Sign in to your console to manage lines, batches and shipments.</p>

    <form class="form mt-6" data-form>
      <div class="field">
        <label for="lemail">Work email</label>
        <input class="input" id="lemail" name="email" type="email" required autocomplete="username" placeholder="you@company.in">
      </div>
      <div class="field">
        <label for="lpass">Password</label>
        <input class="input" id="lpass" name="password" type="password" required autocomplete="current-password" placeholder="••••••••••••">
      </div>

      <div class="auth__row">
        <label class="checkbox"><input type="checkbox" name="remember"><span>Keep me signed in</span></label>
        <a class="link-u small" href="#reset">Forgot password?</a>
      </div>

      <button class="btn btn--primary btn--lg btn--block" type="submit" data-magnetic="0.12">
        <span class="btn__label">Sign in</span>
        <svg><use href="#i-arrow"/></svg>
      </button>

      <div class="form__ok" role="status">
        <svg width="16" height="16"><use href="#i-check"/></svg>
        <span>This is a demonstration form — no credentials were submitted or stored.</span>
      </div>
    </form>

    <div class="auth__sep">Or</div>

    <button class="btn btn--ghost btn--block" type="button" data-magnetic="0.1">
      <span class="btn__label">Continue with SSO</span>
      <svg><use href="#i-lock"/></svg>
    </button>

    <p class="auth__alt">
      New to VeriTrace? <a class="link-u" href="signup.html">Create an account</a>
    </p>

    <div class="row row--wrap gap-3 mt-6" style="justify-content:center">
      <span class="badge">India data residency</span>
      <span class="badge">DPDP compliant</span>
    </div>
  </div>
</section>

<div class="container" style="text-align:center;padding-bottom:2rem">
  <a class="btn btn--link" href="index.html"><span class="btn__label">← Back to veritrace.in</span></a>
</div>
