<section class="auth">
  <div class="auth__card" data-reveal data-reveal-y="30" style="max-width:520px">
    <a class="auth__brand" href="index.html">
      <img src="assets/img/logo-mark.svg" alt="" width="34" height="34">
      <span class="brand__name">Veri<em>Trace</em> AI</span>
    </a>

    <h1 class="h3">Create your account</h1>
    <p class="muted small mt-3">Free to start. No card required. Live in days, not quarters.</p>

    <form class="form mt-6" data-form>
      <div class="form__row">
        <div class="field">
          <label for="sname">Full name <span class="req">*</span></label>
          <input class="input" id="sname" name="name" type="text" required autocomplete="name" placeholder="Priya Sharma">
        </div>
        <div class="field">
          <label for="scompany">Company <span class="req">*</span></label>
          <input class="input" id="scompany" name="company" type="text" required autocomplete="organization" placeholder="Company Pvt Ltd">
        </div>
      </div>

      <div class="form__row">
        <div class="field">
          <label for="semail">Work email <span class="req">*</span></label>
          <input class="input" id="semail" name="email" type="email" required autocomplete="email" placeholder="you@company.in">
        </div>
        <div class="field">
          <label for="sphone">Phone <span class="req">*</span></label>
          <input class="input" id="sphone" name="phone" type="tel" required autocomplete="tel" placeholder="+91 98765 43210">
        </div>
      </div>

      <div class="field">
        <label for="sgst">GSTIN <span class="muted xsmall">(optional — for GST invoices)</span></label>
        <input class="input mono" id="sgst" name="gstin" type="text" placeholder="27AABCU9603R1ZM">
      </div>

      <div class="field">
        <label for="sind">Industry</label>
        <select class="select" id="sind" name="industry">
          <option value="">Select an industry</option>
          <option>Pharmaceuticals &amp; healthcare</option>
          <option>FMCG &amp; D2C</option>
          <option>Agri-inputs, seeds &amp; fertiliser</option>
          <option>Automotive &amp; industrial</option>
          <option>Food &amp; beverage</option>
          <option>Export &amp; global trade</option>
          <option>Other</option>
        </select>
      </div>

      <label class="checkbox">
        <input type="checkbox" name="terms" required>
        <span>I agree to the <a class="link-u" href="terms.html">terms of service</a> and the <a class="link-u" href="privacy.html">privacy notice</a>. <span class="req">*</span></span>
      </label>

      <button class="btn btn--primary btn--lg btn--block" type="submit" data-magnetic="0.12">
        <span class="btn__label">Create account</span>
        <svg><use href="#i-arrow"/></svg>
      </button>

      <div class="form__ok" role="status">
        <svg width="16" height="16"><use href="#i-check"/></svg>
        <span>This is a demonstration form — nothing was submitted. In production this would create your workspace.</span>
      </div>
    </form>

    <p class="auth__alt">
      Already have an account? <a class="link-u" href="login.html">Sign in</a>
    </p>

    <div class="row row--wrap gap-3 mt-6" style="justify-content:center">
      <span class="badge">Free pilot available</span>
      <span class="badge">GST invoicing</span>
      <span class="badge">Cancel anytime</span>
    </div>
  </div>
</section>
