     Loaded on every page via this partial. To disable analytics

     views, and sets first-party cookies. Under India's DPDP Act
     and the EU GDPR this is non-essential processing and needs
     consent. The privacy notice at /privacy/ discloses it.

     If you add a cookie banner later, uncomment the consent-mode
     block below and set 'analytics_storage' from the visitor's
     choice before this script runs — that keeps GA compliant
     without changing anything else here.
     ============================================================ -->

  gtag('consent', 'default', {
    ad_storage: 'denied',

-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MQSDJNY2PG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-MQSDJNY2PG', {
    // Keep IPs out of the stored record. Standard practice in India and the EU.
    anonymize_ip: true
  });
</script>
